name: Publish dashboard to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require live backend URL
        env:
          API_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo 'Set VITE_API_BASE_URL to the public HTTPS backend origin before deploying.'
            exit 1
          fi
      - run: npm ci && npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - run: echo api.ribence.com.np > frontend/dist/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - uses: actions/deploy-pages@v4
        id: deployment
